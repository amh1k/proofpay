[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpay"
version = "0.1.0"
description = "AI-powered payment verification and reconciliation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pillow>=10.2",
    "rapidfuzz>=3.6",
    "jellyfish>=1.2.1",
    "tzdata>=2026.3",
    "dashscope>=1.17",
    "imagehash>=4.3.2",
]

[project.optional-dependencies]
oss = ["oss2>=2.18"]
qwen = ["dashscope>=1.17"]
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "pyyaml>=6.0.3",
    "hypothesis>=6.165.10",
    "playwright>=1.62.0",
    "httpx2>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["proofpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FURB157 rewrites `Decimal("1500")` into `Decimal(1500)`. In a codebase whose
# first rule about money is "never float", steering anyone toward bare numeric
# literals inside a `Decimal(...)` is the wrong habit to encode: the string form
# is exact, and `Decimal(1500.00)` is one keystroke away from a silent bug.
ignore = ["FURB157"]

[tool.ruff.lint.per-file-ignores]
# Naive datetimes are the subject matter of these tests, not an oversight.
# `ClaimedInstant.from_local` takes a local wall-clock reading by design, and
# several tests exist precisely to prove that a naive datetime is refused.
# DTZ stays enabled for `proofpay/`, where it correctly reports nothing.
"tests/**" = ["DTZ001"]


